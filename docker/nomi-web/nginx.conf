worker_processes 4;
events {
  worker_connections 1024;
}
http {
  include mime.types;
  default_type application/octet-stream;
  set_real_ip_from 0.0.0.0/0;
  real_ip_recursive on;
  real_ip_header X-Forwarded-For;
  access_log /dev/stdout;
  error_log /dev/stderr;
  server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Rebranded bundles must always revalidate (their bytes change while the
    # upstream hashed filenames stay the same).
    location /assets-nomi/ {
      add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Compatibility alias: sessions holding a pre-rebrand HTML shell still
    # request /assets/*; serve the rebranded file from the versioned directory
    # so those tabs keep working (and pick up the injector).
    location /assets/ {
      alias /usr/share/nginx/html/assets-nomi/;
      add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
      add_header Cache-Control "no-cache, must-revalidate" always;
      try_files $uri $uri/ /index.html;
    }
  }
}
