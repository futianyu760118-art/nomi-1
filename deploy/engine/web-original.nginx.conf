worker_processes 4;
events {
  worker_connections 1024;
}
http {
  include mime.types;
  default_type application/octet-stream;
  set_real_ip_from 0.0.0.0/0;
  real_ip_recursive on;
  real_ip_header X-Forwarded-For;
  access_log /dev/stdout;
  error_log /dev/stderr;
  server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Backend + embedded sub-apps and file storage are routed by the engine's
    # own proxy so this pristine frontend talks to the same data as the themed
    # one on :8090.
    location ~ ^/(api|auth|god-mode|live|spaces)(/|$) {
      proxy_pass http://proxy:80;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 180s;
      # Never let the SPA shell be cached for API paths.
      add_header Cache-Control "no-store" always;
    }

    location ~ ^/(avatars|file-assets|asset-cover-images)/ {
      proxy_pass http://proxy:80;
      proxy_set_header Host $host;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
